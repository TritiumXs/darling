# Release channel (the only active build channel).
#
# Every build is tied to a version published by the upstream project
# (darlinghq/darling). Two ways to trigger:
#   * schedule: when upstream publishes a release this repo has not built yet
#   * manual:   workflow_dispatch, optionally with an upstream release tag;
#               the version used is still an upstream release, never an
#               arbitrary ref. A manual run rebuilds even if it already exists.
#
# Scheduled workflows only run from the default branch; workflow_dispatch
# works on any branch.
name: Release

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream release tag to build (blank = latest upstream release)
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check for an upstream release to build
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.check.outputs.new }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout Darling
        uses: actions/checkout@v4

      - name: Determine the upstream release to build
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          # Manual dispatch rebuilds the chosen upstream release; the
          # scheduled check only builds versions not published here yet.
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: bash script/ci-check-upstream.sh

  build:
    name: Build release
    needs: check
    if: needs.check.outputs.new == 'true'
    uses: ./.github/workflows/_release-build.yml
    with:
      channel: stable
      version: ${{ needs.check.outputs.tag }}
      release_tag: stable-${{ needs.check.outputs.tag }}
      release_name: Stable ${{ needs.check.outputs.tag }}
      prerelease: false
